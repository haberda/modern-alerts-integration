name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Lint
        run: |
          ruff check custom_components tests
          ruff format --check custom_components tests
      - name: Test
        # The runner forbids the user namespaces Firefox's sandbox needs, so
        # the browser test's page processes die at startup. That test only
        # loads a page served from localhost.
        env:
          MOZ_DISABLE_CONTENT_SANDBOX: "1"
          MOZ_DISABLE_GMP_SANDBOX: "1"
          MOZ_DISABLE_RDD_SANDBOX: "1"
          MOZ_DISABLE_SOCKET_PROCESS_SANDBOX: "1"
        run: python -m pytest -q --timeout=20 --tb=short
