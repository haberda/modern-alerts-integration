acknowledge:
  name: Acknowledge
  description: Silence reminders for the current incident until it resolves. Targets Modern Alerts status sensors.
  target:
    entity:
      integration: modern_alerts
      domain: sensor
unacknowledge:
  name: Resume reminders
  description: Resume on the existing reminder schedule. Does not send immediately or create an incident.
  target:
    entity:
      integration: modern_alerts
      domain: sensor
turn_off:
  name: Acknowledge (turn off)
  description: Alias for acknowledge. Does not disable condition monitoring.
  target:
    entity:
      integration: modern_alerts
      domain: sensor
turn_on:
  name: Resume (turn on)
  description: Alias for unacknowledge. Does not force the problem to become active.
  target:
    entity:
      integration: modern_alerts
      domain: sensor
toggle:
  name: Toggle acknowledgement
  description: Toggle acknowledgement of the selected alert.
  target:
    entity:
      integration: modern_alerts
      domain: sensor
test_notification:
  name: Test notification
  description: Send the current alert message explicitly, without changing incident or resolution eligibility.
  target:
    entity:
      integration: modern_alerts
      domain: sensor
snooze:
  name: Snooze
  description: Silence reminders temporarily. Omit minutes to use this alert's configured default. Acknowledgement is preserved.
  fields:
    minutes:
      name: Minutes
      required: false
      selector:
        number:
          min: 0.016
          max: 10080
          step: any
  target:
    entity:
      integration: modern_alerts
      domain: sensor
cancel_snooze:
  name: Cancel snooze
  description: End temporary silence without clearing acknowledgement or resetting the reminder schedule.
  target:
    entity:
      integration: modern_alerts
      domain: sensor
