acknowledge:
  name: Acknowledge
  description: Silence reminders for the current incident until it resolves. Targets Modern Alerts status sensors.
  target:
    entity:
      integration: modern_alerts
      domain: sensor
unacknowledge:
  name: Resume reminders
  description: Resume on the existing reminder schedule. Does not send immediately or create an incident.
  target:
    entity:
      integration: modern_alerts
      domain: sensor
turn_off:
  name: Acknowledge (turn off)
  description: Alias for acknowledge. Does not disable condition monitoring.
  target:
    entity:
      integration: modern_alerts
      domain: sensor
turn_on:
  name: Resume (turn on)
  description: Alias for unacknowledge. Does not force the problem to become active.
  target:
    entity:
      integration: modern_alerts
      domain: sensor
toggle:
  name: Toggle acknowledgement
  description: Toggle acknowledgement of the selected alert.
  target:
    entity:
      integration: modern_alerts
      domain: sensor
test_notification:
  name: Test notification
  description: Send the current alert message explicitly, without changing incident or resolution eligibility.
  target:
    entity:
      integration: modern_alerts
      domain: sensor
snooze:
  name: Snooze
  description: Silence reminders temporarily. Omit minutes to use this alert's configured default. Acknowledgement is preserved.
  fields:
    minutes:
      name: Minutes
      required: false
      selector:
        number:
          min: 0.016
          max: 10080
          step: any
  target:
    entity:
      integration: modern_alerts
      domain: sensor
cancel_snooze:
  name: Cancel snooze
  description: End temporary silence without clearing acknowledgement or resetting the reminder schedule.
  target:
    entity:
      integration: modern_alerts
      domain: sensor
test_output:
  name: Test selected output
  description: Start one bounded output without creating an incident or sending phone notifications. Inspect output_errors for failures.
  fields:
    output_id:
      name: Output ID
      description: Optional ID from the status sensor configured_outputs attribute. Omit to use the Output to test selector.
      required: false
      selector:
        text:
  target:
    entity:
      integration: modern_alerts
      domain: sensor
stop_outputs:
  name: Stop outputs
  description: Stop running effects and individual tests with cleanup. Does not acknowledge; repeated outputs may run at the next reminder.
  target:
    entity:
      integration: modern_alerts
      domain: sensor
clear_history:
  name: Clear incident history
  description: Delete recent metadata history without changing the incident or reminder schedule.
  target:
    entity:
      integration: modern_alerts
      domain: sensor
complete:
  name: Complete task
  description: Mark a recurring task done. Resolves the current reminder and schedules the next due date. Targets Modern Alerts status sensors.
  fields:
    completed_at:
      name: Completed at
      description: Optional earlier time the task was actually done. Interval tasks count from this time.
      required: false
      selector:
        datetime:
  target:
    entity:
      integration: modern_alerts
      domain: sensor
import_task:
  name: Import recurring task
  description: Create a recurring task from existing values, so a current due date carries over exactly. Administrators only.
  fields:
    name:
      name: Name
      required: true
      selector:
        text:
    mode:
      name: Mode
      required: false
      default: after_completion
      selector:
        select:
          options:
            - after_completion
            - fixed
            - once
    interval:
      name: Interval
      description: For after_completion. Time between completions.
      required: false
      selector:
        duration:
          enable_day: true
    rrule:
      name: Recurrence rule
      description: For fixed. An iCalendar RRULE such as FREQ=WEEKLY;BYDAY=TU.
      required: false
      selector:
        text:
    time:
      name: Time of day
      required: false
      selector:
        time:
    window:
      name: Window
      description: For fixed. How long each occurrence stays due.
      required: false
      selector:
        duration:
    next_due:
      name: Next due
      required: false
      selector:
        datetime:
    last_completed:
      name: Last completed
      required: false
      selector:
        datetime:
    lead_days:
      name: Lead days
      required: false
      selector:
        number:
          min: 0
          max: 365
          step: any
    tags:
      name: Tag IDs
      required: false
      selector:
        text:
          multiple: true
    legacy_actions:
      name: Legacy action IDs
      required: false
      selector:
        text:
          multiple: true
    notifiers:
      name: Notify actions
      required: false
      selector:
        text:
          multiple: true
    notify_entities:
      name: Notify entities
      required: false
      selector:
        entity:
          multiple: true
          filter:
            domain: notify
    repeat:
      name: Repeat intervals (minutes)
      required: false
      selector:
        object:
    message:
      name: Message
      required: false
      selector:
        template:
    title:
      name: Title
      required: false
      selector:
        template:
    done_message:
      name: Done message
      required: false
      selector:
        template:
    action_buttons:
      name: Phone controls
      required: false
      selector:
        boolean:
